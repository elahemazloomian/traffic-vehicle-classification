seed: 42

paths:
  data_dir: data
  checkpoints_dir: checkpoints
  reports_dir: reports

data:
  image_size: 224
  batch_size: 32
  val_fraction: 0.2
  num_workers: 0
  imbalance_classes: []
  imbalance_keep: 1.0
  use_all: false

duplicates:
  max_distance: 8
  near_test_distance: 4
  unseen_classes: [neysan]

split:
  group_distance: 4

augmentation:
  enabled: true
  hflip: 0.5
  rotation_degrees: 10
  translate: 0.05
  scale: [0.9, 1.1]
  brightness: 0.3
  contrast: 0.3

model:
  channels: [32, 64, 128]
  dropout: 0.0
  pooling: max
  name: simple_cnn
  mode: finetune



train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  scheduler: plateau
  scheduler_factor: 0.5
  scheduler_patience: 2
  early_stopping_patience: 6
  save: best
  backbone_lr_scale: 0.1
  sampler: random
  loss: ce